# Settings for ruff (`nix fmt`, and the lint check); the workflow runs the
# code with `nix run`, beside nixkeeper's source (flake.nix).
[project]
name = "nixkeeper-updates"
version = "0.1.0"
description = "A digest of nixpkgs-update's latest attempt at every package, for nixkeeper."
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88  # Python's standard (Black / ruff default)

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, isort
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
